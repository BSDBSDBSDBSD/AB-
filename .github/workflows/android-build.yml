name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APKs (both flavors)
        run: gradle assembleCreditedDebug assemblePlainDebug --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-song-finder-debug
          path: app/build/outputs/apk/**/debug/*.apk

      - name: Publish APKs as GitHub release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/credited/debug/app-credited-debug.apk DuplicateSongFinder-Uri.apk
          cp app/build/outputs/apk/plain/debug/app-plain-debug.apk DuplicateSongFinder.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest DuplicateSongFinder-Uri.apk DuplicateSongFinder.apk \
            --title "Duplicate Song Finder – build ${{ github.run_number }}" \
            --notes "שתי גרסאות: עם קרדיט (Uri) ובלי. APK debug. commit ${{ github.sha }}" --target ${{ github.sha }}
